<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-API Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div>
                <h1>Hệ Thống Tổng Hợp Dashboard</h1>
                <p id="status-text">Bấm nút Làm mới để nạp dữ liệu...</p>
            </div>
            <div class="controls">
                <span id="timer-badge" class="badge hidden">Data loaded in <b id="ms-value">0</b> ms</span>
                <button id="refresh-btn" class="btn-refresh">🔄 Refresh All</button>
            </div>
        </header>

        <main class="dashboard-grid">
            <section class="widget-card" id="widget-user">
                <h2>👤 Đối Tác Ngẫu Nhiên</h2>
                <div class="widget-body"></div>
            </section>

            <section class="widget-card" id="widget-weather">
                <h2>🌤️ Thời Tiết Hà Nội</h2>
                <div class="widget-body"></div>
            </section>

            <section class="widget-card" id="widget-dog">
                <h2>🐶 Thú Cưng Mỗi Ngày</h2>
                <div class="widget-body"></div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
