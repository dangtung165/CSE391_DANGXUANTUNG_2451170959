<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản E-Commerce</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 20px; }
        form { max-width: 600px; margin: 0 auto; }
        fieldset { margin-bottom: 20px; border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
        legend { font-weight: bold; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 150px; font-weight: bold; vertical-align: top; }
        input[type="text"], input[type="email"], input[type="tel"], 
        input[type="date"], input[type="password"], select, textarea {
            width: calc(100% - 160px); padding: 8px; box-sizing: border-box;
        }
        .radio-group label, .checkbox-group label { width: auto; font-weight: normal; margin-right: 15px; }
        button { padding: 10px 20px; margin-right: 10px; cursor: pointer; }
        button[type="submit"] { background-color: #28a745; color: white; border: none; }
        button[type="reset"] { background-color: #dc3545; color: white; border: none; }
    </style>
</head>
<body>

    <form action="#" method="POST">
        
        <fieldset>
            <legend>Thông tin cá nhân</legend>
            
            <div class="form-group">
                <label for="fullname">Họ tên:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên của bạn" required minlength="2" maxlength="50">
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="tel" id="phone" name="phone" placeholder="VD: 0901234567" pattern="[0-9]{10}" title="Vui lòng nhập đúng 10 chữ số" required>
            </div>
            
            <div class="form-group">
                <label for="dob">Ngày sinh:</label>
                <input type="date" id="dob" name="dob" max="2026-05-06" placeholder="dd/mm/yyyy" required>
            </div>
        </fieldset>

        <fieldset>
            <legend>Tài khoản</legend>
            
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" pattern="^[a-zA-Z0-9_]{3,20}$" title="Từ 3-20 ký tự, chỉ gồm chữ cái, số hoặc dấu gạch dưới" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" minlength="8" pattern="(?=.*\d)(?=.*[A-Z]).{8,}" title="Tối thiểu 8 ký tự, phải có ít nhất 1 chữ hoa và 1 chữ số" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Xác nhận password:</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Nhập lại mật khẩu" minlength="8" pattern="(?=.*\d)(?=.*[A-Z]).{8,}" required>
            </div>
        </fieldset>

        <fieldset>
            <legend>Thông tin giao hàng</legend>

            <div class="form-group">
                <label for="city">Thành phố:</label>
                <select id="city" name="city" required>
                    <option value="" disabled selected>-- Chọn Thành phố --</option>
                    <option value="hanoi">Hà Nội</option>
                    <option value="hcm">TP. Hồ Chí Minh</option>
                    <option value="danang">Đà Nẵng</option>
                    <option value="haiphong">Hải Phòng</option>
                    <option value="cantho">Cần Thơ</option>
                </select>
            </div>

            <div class="form-group">
                <label for="district">Quận/Huyện:</label>
                <select id="district" name="district" required>
                    <option value="" disabled selected>-- Chọn Quận/Huyện --</option>
                    <option value="q1">Quận 1</option>
                    <option value="q_badinh">Quận Ba Đình</option>
                    <option value="q_haichau">Quận Hải Châu</option>
                </select>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ chi tiết:</label>
                <textarea id="address" name="address" rows="3" placeholder="Nhập số nhà, tên đường, phường/xã..." required></textarea>
            </div>

            <div class="form-group radio-group">
                <label>Giới tính:</label>
                <input type="radio" id="gender_male" name="gender" value="male" required>
                <label for="gender_male">Nam</label>
                
                <input type="radio" id="gender_female" name="gender" value="female">
                <label for="gender_female">Nữ</label>
                
                <input type="radio" id="gender_other" name="gender" value="other">
                <label for="gender_other">Khác</label>
            </div>
        </fieldset>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">Tôi đã đọc và đồng ý với các điều khoản dịch vụ</label>
        </div>

        <div class="form-group">
            <button type="submit">Đăng ký tài khoản</button>
            <button type="reset">Làm mới form</button>
        </div>

    </form>

    <script>
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dob').setAttribute('max', today);
    </script>
</body>
</html>
