<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Lab</title>
    <link rel="stylesheet" href="boxmodel.css">
</head>
<body>
    <h2>Phần 1: Chứng minh content-box vs border-box</h2>
    
    <div class="container">
        <!-- Hộp 1 -->
        <div class="box box-content">
            <h3>Hộp 1: Content-Box</h3>
            <p>Thuộc tính mặc định của trình duyệt.</p>
        </div>

        <!-- Hộp 2 -->
        <div class="box box-border">
            <h3>Hộp 2: Border-Box</h3>
            <p>Thuộc tính thường dùng trong thực tế.</p>
        </div>
    </div>
</body>
</html>
