<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Keyboard Shortcuts App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery" aria-label="Photo Gallery">
        <div class="img-card" tabIndex="0" aria-label="Image 1">Image 1 (Press 1)</div>
        <div class="img-card" tabIndex="0" aria-label="Image 2">Image 2 (Press 2)</div>
        <div class="img-card" tabIndex="0" aria-label="Image 3">Image 3 (Press 3)</div>
    </div>
    
    <p>💡 Mẹo: Nhấn <strong>Ctrl + K</strong> để mở Command Palette. Nhấn <strong>Space</strong> để chạy Slideshow.</p>

    <div id="palette" class="hidden" role="dialog" aria-modal="true" aria-label="Command Palette">
        <div class="palette-content">
            <input type="text" id="paletteInput" placeholder="Nhập câu lệnh (đóng bằng Esc)..." aria-label="Tìm câu lệnh">
            <ul id="commandList" role="listbox">
                <li role="option" tabIndex="0">Thay đổi Dark Mode</li>
                <li role="option" tabIndex="0">Mở thông báo Alert</li>
                <li role="option" tabIndex="0">Reset Gallery</li>
            </ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
